name: Create Release

on:
  pull_request:
    types: [closed]
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0). Leave empty to use package.json"
        required: false
        type: string
      tag_name:
        description: "Git tag (e.g., v0.1.0). Leave empty to derive from version"
        required: false
        type: string
      pr_number:
        description: "PR number to comment on (optional)"
        required: false
        type: string

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y jq curl zip
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          curl -fsSL https://codeberg.org/forgejo-contrib/forgejo-cli/releases/download/v0.6.0/forgejo-cli-x86_64-linux.tar.gz -o /tmp/fj.tar.gz
          tar -xzf /tmp/fj.tar.gz -C /tmp
          mv /tmp/fj /usr/local/bin/fj
          chmod +x /usr/local/bin/fj
          echo "BUN_INSTALL=$BUN_INSTALL" >> $GITHUB_ENV
          echo "$BUN_INSTALL/bin" >> $GITHUB_PATH
          bun install --production

      - name: Get version from inputs or package.json
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(jq -r '.version' package.json)
          fi

          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v$VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION (tag: $TAG)"

      - name: Build binaries
        run: |
          bun build --compile --target=bun-linux-x64 ./src/index.ts --outfile regexybot-linux-x64
          chmod +x regexybot-linux-x64
          tar -czf regexybot-linux-x64.tar.gz regexybot-linux-x64

          bun build --compile --target=bun-linux-arm64 ./src/index.ts --outfile regexybot-linux-arm64
          chmod +x regexybot-linux-arm64
          tar -czf regexybot-linux-arm64.tar.gz regexybot-linux-arm64

          bun build --compile --target=bun-windows-x64 ./src/index.ts --outfile regexybot-windows-x64.exe
          zip -j regexybot-windows-x64.zip regexybot-windows-x64.exe

          bun build --compile --target=bun-windows-arm64 ./src/index.ts --outfile regexybot-windows-arm64.exe
          zip -j regexybot-windows-arm64.zip regexybot-windows-arm64.exe

      - name: Create release with tag and assets
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="${{ steps.get_version.outputs.tag }}"
          API="https://hangar.nixthedev.ru/api/v1/repos/${{ github.repository }}"
          AUTH="Authorization: token ${{ secrets.GITHUB_TOKEN }}"

          # Delete existing release if present (re-run safety)
          EXISTING_ID=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release $EXISTING_ID for tag $TAG"
            curl -s -X DELETE "$API/releases/$EXISTING_ID" -H "$AUTH"
          fi

          # Delete existing tag if present
          EXISTING_TAG=$(curl -s -H "$AUTH" "$API/tags/$TAG" | jq -r '.name // empty')
          if [ -n "$EXISTING_TAG" ]; then
            echo "Deleting existing tag $TAG"
            curl -s -X DELETE "$API/tags/$TAG" -H "$AUTH"
          fi

          # Build release body
          CHANGELOG_SECTION=$(sed -n "/^<summary><b>\[$VERSION\]/,/^<\/details>/p" CHANGELOG.md | sed 's/<details[^>]*>//g; s/<\/details>//g; s/<summary>//g; s/<\/summary>//g')
          if [ -z "$CHANGELOG_SECTION" ]; then
            CHANGELOG_SECTION="See [CHANGELOG.md](https://hangar.nixthedev.ru/${{ github.repository }}/src/branch/main/CHANGELOG.md) for full release notes."
          fi

          RELEASE_BODY="$CHANGELOG_SECTION"$'\n\n## Binary Downloads\n\n- **Linux (x64)**: Download `regexybot-linux-x64.tar.gz` below\n- **Linux (ARM64)**: Download `regexybot-linux-arm64.tar.gz` below\n- **Windows (x64)**: Download `regexybot-windows-x64.zip` below\n- **Windows (ARM64)**: Download `regexybot-windows-arm64.zip` below\n\n### Binary Installation\n\n**Linux:**\n```bash\ntar -xzf regexybot-linux-x64.tar.gz\nTOKEN=your_token_here ./regexybot-linux-x64\n```\n\n**Windows:**\n```powershell\nExpand-Archive regexybot-windows-x64.zip\nset TOKEN=your_token_here\n.\\regexybot-windows-x64.exe\n```'

          # Create tag + release + upload assets via fj
          fj auth add-token -H hangar.nixthedev.ru "${{ secrets.GITHUB_TOKEN }}"
          fj release create "Release $TAG" \
            --create-tag "$TAG" \
            --branch release \
            --body "$RELEASE_BODY" \
            --attach regexybot-linux-x64.tar.gz \
            --attach regexybot-linux-arm64.tar.gz \
            --attach regexybot-windows-x64.zip \
            --attach regexybot-windows-arm64.zip

      - name: Comment on PR
        if: inputs.pr_number != '' || github.event.pull_request.number != ''
        run: |
          PR_NUMBER="${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number || '' }}"
          TAG="${{ steps.get_version.outputs.tag }}"
          COMMENT_BODY=$(jq -n --arg tag "$TAG" --arg repo "${{ github.repository }}" '{body: ("🎉 Release **" + $tag + "** has been created!\n\n📦 Release URL: https://hangar.nixthedev.ru/" + $repo + "/releases/tag/" + $tag + "\n\n📥 Binaries available for Linux (x64) and Windows (x64)")}')
          curl -s -X POST "https://hangar.nixthedev.ru/api/v1/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$COMMENT_BODY"
