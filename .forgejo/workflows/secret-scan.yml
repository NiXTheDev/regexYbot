name: Secret Scanning

on:
  pull_request:
    branches: [release, dev]
  push:
    branches: [release, dev]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8 detect \
            --source="/repo" \
            --config="/repo/.forgejo/.gitleaks.toml" \
            --report-format=sarif \
            --report-path="/repo/results.sarif" \
            --verbose

      - name: Check if SARIF file exists
        id: check-sarif
        run: |
          if [ -f results.sarif ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "SARIF file found"
            ls -lh results.sarif
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "SARIF file not found"
          fi
