name: Secret Scanning

on:
  pull_request:
    branches: [release, dev]
  push:
    branches: [release, dev]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -fsSL https://api.github.com/repos/zricethezav/gitleaks/releases/latest | sed -n 's/.*"tag_name": *"v\{0,1\}\([^"]*\)".*/\1/p')
          curl -fsSL "https://github.com/zricethezav/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks detect \
            --source="." \
            --config=".forgejo/.gitleaks.toml" \
            --report-format=sarif \
            --report-path="results.sarif" \
            --verbose

      - name: Check if SARIF file exists
        id: check-sarif
        run: |
          if [ -f results.sarif ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "SARIF file found"
            ls -lh results.sarif
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "SARIF file not found"
          fi
