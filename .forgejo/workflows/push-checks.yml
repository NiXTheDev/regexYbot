name: Push Checks

on:
  push:
    branches: [release, dev, "0.*"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: oven/bun:1.4.4
    steps:
      - name: Checkout code
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache bun install cache
        uses: https://hangar.nixthedev.ru/actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: regexybot-bun-${{ hashFiles('bun.lock') }}
          restore-keys: regexybot-bun-

      - name: Install dependencies
        run: bun install -d --frozen-lockfile

      - name: Run lint
        run: bun run lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    container: oven/bun:1.4.4
    steps:
      - name: Checkout code
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache bun install cache
        uses: https://hangar.nixthedev.ru/actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: regexybot-bun-${{ hashFiles('bun.lock') }}
          restore-keys: regexybot-bun-

      - name: Install dependencies
        run: bun install -d --frozen-lockfile

      - name: Check format
        run: bun run fmt:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    container: oven/bun:1.4.4
    steps:
      - name: Checkout code
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache bun install cache
        uses: https://hangar.nixthedev.ru/actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: regexybot-bun-${{ hashFiles('bun.lock') }}
          restore-keys: regexybot-bun-

      - name: Install dependencies
        run: bun install -d --frozen-lockfile

      - name: Run type check
        run: bun check

  test:
    name: Tests
    runs-on: ubuntu-latest
    container: oven/bun:1.4.4
    needs: [lint, format, typecheck]
    steps:
      - name: Checkout code
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache bun install cache
        uses: https://hangar.nixthedev.ru/actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: regexybot-bun-${{ hashFiles('bun.lock') }}
          restore-keys: regexybot-bun-

      - name: Install dependencies
        run: bun install -d --frozen-lockfile

      - name: Run tests
        run: export TOKEN=${{ secrets.TG_BOT_TOKEN }}; bun test --retry=5 --only-failures --parallel

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache bun runtime + install cache
        uses: https://hangar.nixthedev.ru/actions/cache@v4
        with:
          path: ~/.bun
          key: regexybot-bun-1.4.4-${{ hashFiles('bun.lock') }}
          restore-keys: regexybot-bun-1.4.4-

      - name: Install Bun (cache-backed)
        run: |
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          if bun --version 2>/dev/null | grep -q '^1\.4\.3$'; then
            echo "bun already present (cache hit): $(bun --version)"
          else
            curl -fsSL https://bun.sh/install | bash
          fi
          bun --version

      - name: Generate version
        run: |
          bun install -d --frozen-lockfile
          bun run generate

      - name: Get version
        id: version
        run: |
          VERSION=$(bun -e "(async () => { const v = JSON.parse(await Bun.file('.version.json').text()); console.log(v.version); })()")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          BRANCH='${{ github.ref_name }}'
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "commit=$(bun -e "(async () => { const v = JSON.parse(await Bun.file('.version.json').text()); console.log(v.commit); })()")" >> "$GITHUB_OUTPUT"
          echo "released_at=$(bun -e "(async () => { const v = JSON.parse(await Bun.file('.version.json').text()); console.log(v.releasedAt); })()")" >> "$GITHUB_OUTPUT"
          CHANGES=$(bun -e "(async () => { const v = JSON.parse(await Bun.file('.version.json').text()); console.log(v.changes ?? ''); })()")
          {
            echo "changes<<EOF"
            echo "${CHANGES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate tags
        id: tags
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          if [ -z "$VERSION" ]; then VERSION="latest"; fi
          BRANCH='${{ steps.version.outputs.branch }}'
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          FORGEJO_REGISTRY="hangar.nixthedev.ru/${REPO_LOWER}"
          DOCKER_REGISTRY="docker.io/${REPO_LOWER}"
          GHCR_REGISTRY="ghcr.io/${REPO_LOWER}"

          echo "Version: $VERSION"
          echo "Branch: $BRANCH"

          # Detect prerelease: a SemVer carrying a hyphen (e.g. 0.3.0-rc1)
          IS_PRERELEASE=0
          case "$VERSION" in
            *-*) IS_PRERELEASE=1 ;;
          esac

          # Build suffix list based on prerelease status and branch
          if [ "$IS_PRERELEASE" = "1" ]; then
            echo "Building for prerelease: $VERSION"
            SUFFIXES="latest,dev,${VERSION},preview"
          elif [ "$BRANCH" = "release" ]; then
            echo "Building for release branch (stable release)"
            SUFFIXES="latest,release"
            if [ "$VERSION" != "latest" ]; then
              SUFFIXES="${SUFFIXES},${VERSION}"
              CURRENT="$VERSION"
              while true; do
                PREV="$CURRENT"
                CURRENT=$(echo "$CURRENT" | sed 's/\.[^.]*$//')
                if [ "$CURRENT" = "$PREV" ] || [ -z "$CURRENT" ]; then break; fi
                SUFFIXES="${SUFFIXES},${CURRENT}"
              done
            fi
          else
            echo "Building for non-release branch: $BRANCH"
            SUFFIXES="dev,latest"
            if [ "$VERSION" != "latest" ]; then
              CURRENT="$VERSION"
              while true; do
                SUFFIXES="${SUFFIXES},${CURRENT}-dev"
                PREV="$CURRENT"
                CURRENT=$(echo "$CURRENT" | sed 's/\.[^.]*$//')
                if [ "$CURRENT" = "$PREV" ] || [ -z "$CURRENT" ]; then break; fi
              done
            fi
          fi

          # Apply suffixes to all registries
          TAGS=""
          IFS=','
          for REG in "$FORGEJO_REGISTRY" "$DOCKER_REGISTRY" "$GHCR_REGISTRY"; do
            for SUFFIX in $SUFFIXES; do
              TAGS="${TAGS},${REG}:${SUFFIX}"
            done
          done
          unset IFS
          TAGS="${TAGS#,}"

          echo "Tags: $TAGS"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Cache the pinned docker CLI
        uses: https://hangar.nixthedev.ru/actions/cache@v4
        with:
          path: /usr/local/bin/docker
          key: regexybot-docker-cli-28.0.4-linux-amd64

      - name: Install Docker CLI
        run: |
          if docker --version 2>/dev/null | grep -q '28.0.4'; then
            echo "docker CLI already present (cache hit): $(docker --version)"
            exit 0
          fi
          curl -fsSL "https://download.docker.com/linux/static/stable/$(uname -m)/docker-28.0.4.tgz" | tar xz -C /usr/local/bin --strip-components=1 docker/docker

      - name: Set up QEMU
        uses: https://hangar.nixthedev.ru/docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://hangar.nixthedev.ru/docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: https://hangar.nixthedev.ru/docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Forgejo Container Registry
        uses: https://hangar.nixthedev.ru/docker/login-action@v3
        with:
          registry: hangar.nixthedev.ru
          username: ${{ github.repository_owner }}
          password: ${{ secrets.HGPR_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: https://hangar.nixthedev.ru/docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push to Forgejo Container Registry
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            RELEASED_AT=${{ steps.version.outputs.released_at }}
            CHANGES=${{ steps.version.outputs.changes }}
          cache-from: |
            type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
            type=registry,ref=hangar.nixthedev.ru/${{ steps.repo.outputs.name }}:buildcache
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true
